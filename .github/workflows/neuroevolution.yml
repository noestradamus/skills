name: Neuroevolution CPU checks

on:
  push:
    paths:
      - 'skills/neuroevolution/**'
      - '.github/workflows/neuroevolution.yml'
  pull_request:
    paths:
      - 'skills/neuroevolution/**'
      - '.github/workflows/neuroevolution.yml'

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: skills/neuroevolution
    env:
      MPLCONFIGDIR: /tmp/neuroevolution-matplotlib
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.13
      - run: uv sync --frozen
      - run: uv run --frozen python -m pytest -q
      - name: Execute and replay the public quickstart
        run: |
          uv run --frozen neuroevo run examples/ga-xor.toml --out /tmp/neuroevolution-ci-example
          uv run --frozen neuroevo replay /tmp/neuroevolution-ci-example --seed 10000
