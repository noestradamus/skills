[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuroevolution-lab"
version = "0.1.0"
description = "Reproducible neural and LLM-agent evolution operated through an agent skill"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.3", "scipy==1.18.1", "cma==4.5.0", "ribs==0.12.0",
  "pymoo==0.6.2", "torch==2.14.0", "gymnasium==1.3.0",
  "pydantic==2.13.5", "httpx==0.28.1", "matplotlib==3.11.2",
  "neat-python @ https://github.com/CodeReclaimers/neat-python/archive/7d9acae0a1e5d7ed6199ffbd525dd15c5c87a86f.tar.gz",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[project.scripts]
neuroevo = "neuroevolution_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neuroevolution_lab"]

[tool.hatch.metadata]
allow-direct-references = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
